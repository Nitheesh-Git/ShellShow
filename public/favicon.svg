<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#f5c2e7"/>
    </linearGradient>
  </defs>

  <!-- Dark background for contrast -->
  <rect width="100" height="100" rx="20" fill="#11111b"/>

  <!-- Inner border -->
  <rect x="4" y="4" width="92" height="92" rx="16" fill="none" stroke="#313244" stroke-width="2"/>

  <!-- Terminal prompt symbol > -->
  <text x="18" y="62" font-family="monospace" font-size="50" font-weight="bold" fill="#a6e3a1">&gt;</text>

  <!-- Blinking cursor -->
  <rect x="52" y="32" width="6" height="35" rx="2" fill="#cba6f7">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Shell spiral accent in corner -->
  <path d="M 72 20 Q 85 22 83 35 Q 81 45 72 43 Q 65 41 68 33 Q 70 27 76 30"
        fill="none" stroke="#f5c2e7" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Small decorative dots -->
  <circle cx="78" cy="70" r="3" fill="#89b4fa" opacity="0.6"/>
  <circle cx="85" cy="78" r="2" fill="#f9e2af" opacity="0.6"/>
</svg>
